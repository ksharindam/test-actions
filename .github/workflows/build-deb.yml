name: Build Deb

on:
  workflow_dispatch:
  #push:
  #release:
  #  types: [published]

# required for uploading assets
permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Build Deb
        run: |
          sudo apt-get update
          sudo apt-get install -y debhelper dh-python build-essential python3-pyqt5 pyqt5-dev-tools
          sudo pip3 install --ignore-installed setuptools packaging
          dpkg-buildpackage -b -uc -us
          mv ../*.deb chemcanvas_all.deb

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Debian-Package
          path: "*.deb"
          retention-days: 2

